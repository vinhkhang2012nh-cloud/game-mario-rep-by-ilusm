<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Mario rep1:1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Game Mario by ILUSM</h1>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <p>Dùng phím <b>A / D</b> để di chuyển, <b>Space</b> để nhảy.</p>

    <div id="mobile-controls">
        <div class="left-controls">
            <button id="btn-left">◀</button>
            <button id="btn-right">▶</button>
        </div>
        <div class="right-controls">
            <button id="btn-jump">▲</button>
        </div>
    </div>

   <div id="jumpscare-layer" style="
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh; 
    background-color: rgb(245, 0, 0); 
    z-index: 9999; 
    justify-content: center; 
    align-items: center;">
    
    <img id="jumpscare-img" src="goomba.png" style="width: 80vh; height: 80vh; transform: scale(1);" />
</div>

    <div id="custom-alert" style="
        display: none; 
        position: fixed; 
        top: 0; left: 0; 
        width: 100vw; height: 100vh; 
        background-color: rgba(0, 0, 0, 0.7); 
        z-index: 10000; 
        justify-content: center; 
        align-items: center;">
        
        <div style="
            background-color: #222; 
            color: white; 
            padding: 30px; 
            border-radius: 15px; 
            border: 4px solid #fcb434; 
            text-align: center; 
            box-shadow: 0 0 20px rgba(252, 180, 52, 0.5);
            font-family: Arial, sans-serif;
            min-width: 320px;">
            
            <h2 id="alert-title" style="margin-top: 0; color: #ff4757; font-size: 26px;">GAME OVER 🎮</h2>
            <p id="alert-message" style="font-size: 18px; line-height: 1.5; margin: 20px 0;">Nội dung...</p>
            
            <button id="alert-button" style="
                background-color: #fcb434; 
                color: black; 
                border: none; 
                padding: 10px 30px; 
                font-size: 18px; 
                font-weight: bold; 
                border-radius: 5px; 
                cursor: pointer;
                transition: 0.2s;">
                THỬ LẠI XEM
            </button>
        </div>
    </div>

    <script src="game.js"></script>

</body>
</html>
